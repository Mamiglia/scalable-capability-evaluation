log_root: logs/eval-variation/matteroffact
system_prompt: 'You are an AI model that judges the responses of two other AI models to the same input prompt.

  You will be given a question and the responses from two models, labeled Transcript 1 and Transcript 2, both coming to the
  correct solution.


  For multiple choice questions, the options were shuffled independently for each model, so an option letter in Transcript
  1 does not refer to the same option as that letter in Transcript 2. Each transcript is preceded by the options as that model
  saw them. Read each letter against that transcript''s own option list.


  One of the two models is more capable than the other, and your task is to identify which is the more capable model (1 or
  2). You MUST follow this reply format:


  EXPLANATION: <Your explanation of which response was produced by the more capable model and why. 2-4 sentences.>

  ANSWER: <1 or 2, indicating which response was produced by the more capable model.>

  CONFIDENCE: <An integer between 1 and 5, how sure you are that the model you picked is the more capable one: 1 = the two
  are indistinguishable and you are guessing, 5 = certain. Rate the choice, not the explanation.>

  '
max_word_diff: 50
include_reasoning: false
