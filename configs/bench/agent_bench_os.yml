# AgentBench OS split: react agent with bash/python in a Docker sandbox, 125 test samples.
# One image built per sample (shared base layers); under rootless podman run builds with --max-subprocesses 1.
#
# The cap is on turns, not wall time. The task's own default (max_sample_time_mins=10) killed
# 27/125 samples for deepseek-r1-0528 — most still on their first bash call — which measures
# provider throughput, not capability, and would push slow reasoning models down the theta
# scale. max_sample_time_mins is now only a runaway guard: completed samples ran p50 280s /
# p90 493s, so 60 min never binds. max_messages is what actually stops a sample, and unlike
# an eval_set-level `turn_limit` it is a task arg, so it is part of the data-dir hash.
name: agent_bench_os
task: inspect_evals/agent_bench_os
task_args:
  split: test
  max_messages: 50
  max_sample_time_mins: 60
