# SCIENCE: GPQA-diamond + ARC-Challenge (200-item subset) + HLE-Verified gold, science categories only.
name: science
benches:
  - bench: configs/bench/gpqa.yml
    system_prompt: assets/system_prompt/mcq.txt
  - bench: configs/bench/arc_challenge.yml
    system_prompt: assets/system_prompt/mcq.txt
  - bench: configs/bench/hle.yml
    hle_gold: true
    metadata: {category: [Physics, Chemistry, Biology/Medicine, Computer Science/AI, Engineering]}
  # same items, same ids as the entry above (gold-only hash) - pools as one bench;
  # models collected from 2026-09 on live here, earlier ones under hle.yml's hash.
  - bench: configs/bench/hle_gold.yml
    hle_gold: true
    metadata: {category: [Physics, Chemistry, Biology/Medicine, Computer Science/AI, Engineering]}
