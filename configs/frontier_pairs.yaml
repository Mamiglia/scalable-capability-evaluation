# Pairs that place the frontier models (best per quarter, Epoch logs plus our own pool) on
# the judged-capability curve. scripts/judge/gen_frontier_judge_config.py turns this into
# run_judging.py configs.
#
# Rules: every model released after the judge (o4-mini, 2025-04-16) is paired only with
# models released before itself; models released before the judge pair freely. Each
# model gets at least three opponents spanning the accuracy range. Pairs already judged
# in the pilot are not repeated.

judge: openrouter/deepseek/deepseek-v4-flash-0731
judge_release: '2025-04-16'
epoch_logs:
  gpqa: configs/epoch_logs_gpqa_frontier.yaml
  swe_bench_mini: configs/epoch_logs_swe.yaml
epoch_trimmed_root:            # trimmed Epoch logs in the pool layout (trim_epoch_swe_logs.py)
  swe_bench_mini: data/swe_bench_mini/epoch-bash-agent
pool:
  gpqa: data/gpqa/b0a0d9c9
  swe_bench_mini: data/swe_bench_mini/477dc96c
pool_dirs:                     # short name -> pool directory where they differ
  gemma3-12b-it: gemma-3-12b-it
  gemma4-e2b-it: gemma-4-e2b-it
  nemotron-3-ultra-550b-a55b: nvidia-nemotron-3-ultra-550b-a55b-bf16
  nemotron-3.5-lightning: nvidia-nemotron-3.5-lightning-30b-a3b-bf16

pairs:
  gpqa:
    # released before the judge
    gpt-4-1106: [claude-3-opus, claude-3.5-sonnet-0620, gpt-4.1, gemma3-12b-it]
    claude-3-opus: [claude-3.5-sonnet-0620, gpt-4.1, qwen3-32b]
    claude-3.5-sonnet-0620: [o1-mini-high, gpt-4.1, mistral-medium-3]
    o1-mini-high: [o1-high, gpt-4.1, qwen3-32b]
    o1-high: [gemini-2.5-pro-exp-0325, deepseek-r1-0528, o3]
    gemini-2.5-pro-exp-0325: [o3, gpt-4.1, deepseek-r1-0528]
    # released after the judge: opponents released earlier
    gemini-2.5-pro: [gemini-2.5-pro-exp-0325, o3, o1-high, deepseek-r1-0528, qwen3-32b]
    gpt-5-high: [gemini-2.5-pro, o3, deepseek-r1-0528, o1-high, mistral-medium-3]
    gemini-3-pro-preview: [gpt-5-high, gemini-2.5-pro, claude-sonnet-4.5, glm-4.6, gpt-5]
    gemini-3.1-pro-high: [gemini-3-pro-preview, kimi-k2.6, deepseek-v3.2, qwen3.5-9b, gpt-5-high]
    claude-opus-4.7: [gemini-3.1-pro-high, kimi-k2.6, gemini-3-pro-preview]
    gpt-5.5-xhigh: [gemini-3.1-pro-high, claude-opus-4.7, kimi-k2.6, qwen3.5-4b, gemini-3-pro-preview]
    gemini-3.5-flash: [gpt-5.5-xhigh, claude-opus-4.7, gemini-3.1-pro-high]
    kimi-k3: [gemini-3.5-flash, glm-5.2, gpt-5.5-xhigh]
    claude-opus-5: [gpt-5.5-xhigh, gemini-3.5-flash, glm-5.2, kimi-k3, nemotron-3-ultra-550b-a55b]
    glm-5.3: [claude-opus-5, gemini-3.5-flash, glm-5.2]
  swe_bench_mini:
    # released before the judge
    gpt-4o-1120: [claude-3.7-sonnet, gpt-4.1, o3, deepseek-r1-0528]
    claude-3.7-sonnet: [o3, gpt-4.1, gpt-5]
    # released after the judge: opponents released earlier
    claude-opus-4: [claude-3.7-sonnet, o3, gpt-4o-1120, gpt-4.1]
    gpt-5-high: [claude-opus-4, claude-3.7-sonnet, o3, deepseek-r1-0528]
    claude-opus-4.5: [gpt-5-high, claude-sonnet-4.5, glm-4.6, claude-opus-4, gpt-5]
    claude-opus-4.6: [claude-opus-4.5, deepseek-v3.2, kimi-k2.6, claude-sonnet-4.5, gpt-5-high]
    gpt-5.4-high: [claude-opus-4.6, claude-opus-4.5, deepseek-v3.2, kimi-k2.6, qwen3.5-9b]
    claude-opus-4.7: [gpt-5.4-high, claude-opus-4.6, claude-opus-4.5]
    kimi-k3: [gpt-5.4-high, glm-5.2, gemini-3.5-flash]
    glm-5.3: [claude-opus-4.7, qwen3.8-2.4t-a95b, glm-5.2]
