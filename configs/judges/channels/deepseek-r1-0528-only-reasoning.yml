# Pairwise channel condition (math, science): configs/judges/reasoning/deepseek-r1-0528.yml showing only the reasoning of each transcript
# (channels: reasoning, text, calls, outputs). Math and science transcripts have no tool calls, so this is the CoT-only
# counterpart of the reasoning-hidden run. Judged on 10 train items per global-b quartile (seeded, same for every pair).
name: deepseek-r1-0528
judge: configs/models/deepseek/deepseek-r1-0528.yml
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_tokens: 32768, max_retries: 5}  # provider 5xx: cap the backoff near 1.5 min; errored samples are re-judged on resume
channels: only-reasoning
train_per_quartile: 10
