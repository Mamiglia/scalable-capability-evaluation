# Pairwise channel condition (math, science): configs/judges/reasoning/glm-4.7.yml showing only the reasoning of each transcript
# (channels: reasoning, text, calls, outputs). Math and science transcripts have no tool calls, so this is the CoT-only
# counterpart of the reasoning-hidden run. Judged on 10 train items per global-b quartile (seeded, same for every pair).
name: glm-4.7
judge: configs/models/zai/glm-4.7.yml
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_tokens: 32768}
channels: only-reasoning
train_per_quartile: 10
