# Pairwise channel condition (2025-II): configs/judges/reasoning/minimax-m1.yml with channels drop-tools
# (channels: reasoning, text, calls, outputs; tools = calls and outputs), on 10 train items per global-b quartile.
name: minimax-m1
judge: configs/models/minimax/minimax-m1-judge.yml  # first-party endpoint (see that file): novita throttled judging
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_connections: 16, max_retries: 5}  # MiniMax first-party 5xx: cap the backoff near 1.5 min; errored samples are re-judged on resume
channels: drop-tools
train_per_quartile: 10
