# Pairwise channel condition (math, science): configs/judges/reasoning/minimax-m1.yml showing only the reasoning of each transcript
# (channels: reasoning, text, calls, outputs). Math and science transcripts have no tool calls, so this is the CoT-only
# counterpart of the reasoning-hidden run. Judged on 10 train items per global-b quartile (seeded, same for every pair).
name: minimax-m1
judge: configs/models/minimax/minimax-m1-judge.yml  # first-party endpoint (see that file): novita throttled judging
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_connections: 16, max_retries: 5}  # MiniMax first-party 5xx: cap the backoff near 1.5 min; errored samples are re-judged on resume
channels: only-reasoning
train_per_quartile: 10
