# Reasoning-hidden twin of configs/judges/reasoning/minimax-m1.yml: identical condition except include_reasoning (the subjects'
# reasoning blocks are stripped); full train set, nothing truncated, a pair too long for the judge's context is left unscored.
name: minimax-m1
include_reasoning: false
judge: configs/models/minimax/minimax-m1-judge.yml  # first-party endpoint (see that file): novita throttled judging
max_length: 100000000
_kwargs: {fail_on_error: false, max_connections: 16}
