# Reasoning-on reference-as-judge for coding 2026-I (top-3 of data/meta/coding/fit.yml): the subjects' reasoning
# traces are shown, nothing is truncated, and a pair too long for the judge's context is left unscored
# (fail_on_error off) instead of failing the task. Output capped: the endpoint refuses prompt + max_tokens > context.
name: deepseek-v3.2
judge: configs/models/deepseek/deepseek-v3.2.yml
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_tokens: 32768}
train_per_quartile: 0  # full train set (coding 2026-I, 2026-09-15); the 40-item run is hard-linked into this condition dir
