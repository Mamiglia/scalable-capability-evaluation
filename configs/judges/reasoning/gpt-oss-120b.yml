# Reasoning-on twin of configs/judges/gpt-oss-120b.yml: the subjects' reasoning traces are shown (a plain model's
# transcript is shown as is), nothing is truncated, and a pair too long for the judge's context is left
# unscored (fail_on_error off) instead of failing the task.
name: gpt-oss-120b
judge: configs/models/openai/gpt-oss-120b.yml
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false}
train_per_quartile: 0  # full train set (2026-I, all four domains, 2026-09-17)
