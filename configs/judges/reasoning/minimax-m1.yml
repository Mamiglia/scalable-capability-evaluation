# Reasoning-on twin of configs/judges/minimax-m1.yml: the subjects' reasoning traces are shown (a plain model's
# transcript is shown as is), nothing is truncated, and a pair too long for the judge's context is left
# unscored (fail_on_error off) instead of failing the task.
name: minimax-m1
judge: configs/models/minimax/minimax-m1.yml
include_reasoning: true
max_length: 100000000
_kwargs: {fail_on_error: false, max_connections: 16}
