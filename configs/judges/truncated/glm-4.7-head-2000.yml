# Pairwise truncation control (cyber 2026-I): configs/judges/reasoning/glm-4.7.yml on the full train set with each
# transcript cut to its head 2,000 characters. Same items, prompt, orders and reasoning visibility as the baseline.
name: glm-4.7
judge: configs/models/zai/glm-4.7.yml
include_reasoning: true
max_length: 2000
truncate: head
_kwargs: {fail_on_error: false, max_tokens: 32768}
