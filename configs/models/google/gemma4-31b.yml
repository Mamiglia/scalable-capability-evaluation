# Quantization: unquantized bf16 on Novita. CoreWeave dropped its bf16 endpoint on
# 2026-08-24 (fp4 only now); OpenInference bf16 silently drops the second transcript on
# long prompts, so it is never used.
name: google/gemma-4-31b-it
slug: openrouter/google/gemma-4-31b-it
release_date: '2026-03-31'
generate_args:
  extra_body:
    reasoning:
      enabled: true
model_args:
  provider:
    only:
    - novita/bf16
    allow_fallbacks: false
    quantizations:
    - bf16
