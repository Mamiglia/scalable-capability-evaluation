# Quantization: Unquantized BF16 (vLLM / Runpod)
# Llama 3 (Apr 2024), not 3.1/3.3 — those are the only 70Bs left on OpenRouter.
name: meta-llama/Meta-Llama-3-70B-Instruct
release_date: "2024-04-18"
runpod:
  use: true
  model: meta-llama/Meta-Llama-3-70B-Instruct   # gated: HF_TOKEN must have accepted the license
  name: sce-llama-3-70b
  cloud_type: SECURE
  # 141GB of bf16 weights: 4×A40 (192GB) leaves ~45GB of KV.
  gpu_id: NVIDIA A40
  gpu_count: 4
  # hf_transfer: a cold 140GB pull ran past the old 5400s ceiling on deepseek-67b.
  env: {NCCL_P2P_DISABLE: "1", HF_HUB_ENABLE_HF_TRANSFER: "1"}
  container_disk_in_gb: 170
  ready_timeout: 10800
  vllm_args:
    - --tensor-parallel-size
    - "4"
    - --disable-custom-all-reduce
    - --max-model-len
    - "8192"   # native context
