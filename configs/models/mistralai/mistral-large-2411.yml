# Quantization: Unquantized BF16 (vLLM / Runpod)
# OpenRouter delisted mistral-large-2411; both `mistral-large` and `mistral-large-2407`
# now serve 2407 (checked 2026-09-08), so 2411 has to be self-hosted.
name: mistralai/Mistral-Large-Instruct-2411
release_date: "2024-11-18"
runpod:
  use: true
  model: mistralai/Mistral-Large-Instruct-2411   # gated: HF_TOKEN must have accepted the MRL
  name: small-judge-mistral-large-2411
  cloud_type: SECURE
  # 245GB of bf16 weights. 8×A40 (384GB) looks cheapest but has no 8-GPU capacity in
  # secure cloud, and the L40S host it fell back to died at engine init before the weights
  # even downloaded (8-way PCIe collectives). 4×A100 80GB (320GB) is the working fit.
  gpu_id: NVIDIA A100 80GB PCIe
  gpu_count: 4
  # 48GB cards cannot hold 245GB across 4 GPUs, so the default fallback ladder would
  # guarantee an OOM: only 80GB tiers are valid substitutes here.
  fallback_gpus: ["NVIDIA A100-SXM4-80GB", "NVIDIA H100 PCIe", "NVIDIA H100 80GB HBM3"]
  env: {NCCL_P2P_DISABLE: "1", HF_HUB_ENABLE_HF_TRANSFER: "1"}
  container_disk_in_gb: 320
  ready_timeout: 10800   # 245GB download plus TP init
  vllm_args:
    - --tensor-parallel-size
    - "4"
    - --disable-custom-all-reduce
    # The repo ships the weights twice (model-*.safetensors and consolidated-*,
    # 245GB each); without this vLLM pulls both and fills the disk.
    - --ignore-patterns
    - "consolidated*"
    - --max-model-len
    - "32768"   # 128k native, but KV for 8 concurrent 128k sequences does not fit
