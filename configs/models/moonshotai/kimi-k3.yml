# deliberate: pinned to moonshotai/mxfp4, a 4-bit endpoint. k3 numbers are measured at
# 4-bit; say so when reporting them.
# Was deepinfra/bf16, whose 16384 cap truncated 87% of APEX and ~11% of GPQA.
# baseten/fp8 would be the better choice — its 262144 cap clears the 131072 this config
# now asks for — but it 429s persistently (3/3 probes). Revisit if that capacity frees up.
name: moonshotai/Kimi-K3
slug: openrouter/moonshotai/kimi-k3
release_date: '2026-07-16'
model_args:
  provider:
    only:
    - moonshotai
    allow_fallbacks: false
generate_args:
  max_tokens: 131072   # not ctx-16k: the reprompt turn blows that budget (as on glm-5.2).
                     # 8x the 16384 cap that truncated 792/2158 HLE samples, so ample.
