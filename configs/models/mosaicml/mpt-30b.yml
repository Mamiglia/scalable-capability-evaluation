# Quantization: vLLM Fallback (Runpod)
name: mosaicml/mpt-30b
slug: vllm/mosaicml/mpt-30b
release_date: "2023-06-22"
runpod:
  use: true
  model: adamrb/mpt-30b-chat-safetensors
  name: small-judge-mpt-30b
  cloud_type: SECURE
  # 60GB of weights: 2×A40 (96GB, $0.88/h) beats one A100 80GB ($1.39/h). Slower decode.
  gpu_id: NVIDIA A40
  gpu_count: 2
  # Runpod's multi-GPU PCIe hosts (A40, L40S) ship with GPU peer-to-peer broken: NCCL init or
  # the first all-reduce hangs with every GPU at 100%. Seen 2026-09-03 on 2×A40 and 4×A40/L40S.
  env: {NCCL_P2P_DISABLE: "1"}
  ready_timeout: 3600
  container_disk_in_gb: 100
  vllm_args: [--trust-remote-code, --tensor-parallel-size, "2", --disable-custom-all-reduce]  # see qwen3-32b.yml




