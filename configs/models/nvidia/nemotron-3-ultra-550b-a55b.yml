# max_tokens 500000 not 512288: the context window is shared with the prompt.
name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
slug: openrouter/nvidia/nemotron-3-ultra-550b-a55b
release_date: '2026-06-04'
generate_args:
  extra_body:
    reasoning:
      enabled: true
  max_tokens: 500000
model_args:
  provider:
    only:
    - together
    allow_fallbacks: false
