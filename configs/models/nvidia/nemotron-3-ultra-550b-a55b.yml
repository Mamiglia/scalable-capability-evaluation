# deliberate: pinned to `together`, which declares no quantization. Every endpoint that
# does declare one is lower precision (venice/fp8, deepinfra/fp4, baseten/fp4), and
# together is the only one with room for this config's 495904 max_tokens. The BF16 in
# the model name is unverified -- do not repeat it in write-ups without measuring.
# pin: Together, NVFP4 (stated in Together's serverless docs; OpenRouter reports 'unknown').
# Was venice/fp8, which hard-caps at 16384 whatever max_tokens says, truncating ~25% of
# GPQA. Every endpoint with real headroom is 4-bit, so this trades fp8 for completeness.
name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
slug: openrouter/nvidia/nemotron-3-ultra-550b-a55b
release_date: '2026-06-04'
generate_args:
  extra_body:
    reasoning:
      enabled: true
  # 182520 is baseten/fp4's declared cap. It was left at together's 495904 after the
  # 2026-08-31 repin, which 400s every request (seen 2026-09-08).
  max_tokens: 182520
model_args:
  provider:
    only:
    # 2026-08-31: OpenRouter no longer routes this slug to together (404 "permits only:
    # together"; live endpoints deepinfra/fp4, baseten/fp4, venice/fp8). Repinned to
    # baseten/fp4 - same nominal precision as together's NVFP4, and the only non-venice
    # endpoint with output headroom (182520; venice hard-caps 16384, see above).
    # gpqa/hle data collected earlier via together; terminal_bench_2_1 onward is baseten.
    - baseten/fp4
    allow_fallbacks: false
