# Pinned to OpenAI first-party (Azure endpoints also serve this slug). Non-reasoning.
name: openai/gpt-4.1
release_date: '2025-04-14'
model_args:
  # OpenAI strictly validates tool schemas and 400s on harbor's update_plan
  # (its optional params lack a full `required` array). inspect's strict_tools defaults
  # to true; disable it so tool defs are sent non-strict, as every other provider gets.
  strict_tools: false
  provider:
    only:
    - openai
    allow_fallbacks: false
generate_args:
  max_tokens: 32768
