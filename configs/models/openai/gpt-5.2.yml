name: openai/gpt-5.2
slug: openrouter/openai/gpt-5.2
release_date: '2025-12-11'
model_args:
  # OpenAI strictly validates tool schemas and 400s on harbor's update_plan
  # (its optional params lack a full `required` array). inspect's strict_tools defaults
  # to true; disable it so tool defs are sent non-strict, as every other provider gets.
  strict_tools: false
  provider:
    # openai/flex is the tier-specific endpoint slug: half price, higher latency, no
    # fallback to the default tier (a capacity shortfall surfaces as an error instead).
    only:
    - openai/flex
    allow_fallbacks: false
generate_args:
  extra_body:
    reasoning:
      effort: medium
  max_tokens: 128000
