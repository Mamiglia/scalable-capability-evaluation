# GPT-5.6 Sol = the flagship of the GPT-5.6 series (OpenRouter's `openai/gpt-5.6` is an alias of
# it; terra / luna are the smaller tiers, -pro is the same model at reasoning.mode=pro).
name: openai/gpt-5.6-sol
slug: openrouter/openai/gpt-5.6-sol
release_date: '2026-07-09'
model_args:
  # OpenAI strictly validates tool schemas and 400s on harbor's update_plan (gpt-5.2.yml note);
  # send tool defs non-strict, as every other provider gets.
  strict_tools: false
  provider:
    # Standard tier. The terminal_bench_2_1 frontier run (2026-09-17) used `openai/flex` (half price)
    # and crawled for hours in 30-min retry loops once OpenRouter rate-limited that tier upstream;
    # the same model on the same first-party provider, so later runs pay list price for throughput.
    # Prompt caching is automatic on OpenAI.
    only:
    - openai
    allow_fallbacks: false
generate_args:
  extra_body:
    reasoning:
      effort: medium
  max_tokens: 128000
