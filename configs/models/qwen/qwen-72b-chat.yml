# Quantization: Unquantized BF16 (vLLM / Runpod)
# Qwen 1 (Nov 2023), not the Qwen1.5/2 72B. Not on OpenRouter (checked 2026-09-08).
name: Qwen/Qwen-72B-Chat
release_date: "2023-11-30"
generate_args:
  # vLLM defaults to 512 output tokens when the request sends none: 29/198 GPQA samples were
  # cut off mid-reasoning before writing "ANSWER:". Capped so prompt+output fits the 8192
  # native context: longest GPQA prompt measured at 2822 tokens (2822+5120=7942).
  max_tokens: 5120
  # v0.23 does not register Qwen-1's ChatML turn token as a stop token, so it decodes literally
  # and the model rambles into a second turn.
  stop_seqs: ["<|im_end|>"]
runpod:
  use: true
  model: Qwen/Qwen-72B-Chat
  name: small-judge-qwen-72b-chat
  cloud_type: SECURE
  # vLLM dropped QWenLMHeadModel (Qwen 1) after v0.23.0: the pinned v0.28.0 image exits at
  # engine config with "not supported anymore". v0.23.0 is the last release that loads it.
  image: vllm/vllm-openai:v0.23.0
  # 145GB of bf16 weights. 4×A40 (192GB) OOMs on engine init: at the default 0.9
  # utilization only ~172GB is usable and vLLM 0.23 profiles the KV cache after the
  # weights land. 8×A40 (384GB) worked but 8-GPU nodes had no capacity on 2026-09-10
  # (18 create attempts), so 4×80GB (320GB) instead: A100 first, H100 as fallback.
  gpu_id: NVIDIA A100 80GB PCIe
  gpu_count: 4
  fallback_gpus: ["NVIDIA A100-SXM4-80GB", "NVIDIA H100 80GB HBM3", "NVIDIA H100 PCIe", "NVIDIA H100 NVL"]
  # hf_transfer: a cold 140GB pull ran past the old 5400s ceiling on deepseek-67b.
  env: {NCCL_P2P_DISABLE: "1", HF_HUB_ENABLE_HF_TRANSFER: "1"}
  container_disk_in_gb: 200
  ready_timeout: 10800
  vllm_args:
    - --tensor-parallel-size
    - "4"
    - --disable-custom-all-reduce
    # QWenLMHeadModel ships custom modelling code in the repo.
    - --trust-remote-code
    - --max-model-len
    - "8192"   # native context; 32k needs the NTK config the repo disables by default
