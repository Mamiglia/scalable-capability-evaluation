# Quantization: Unquantized BF16 (vLLM / Runpod)
name: Qwen/Qwen3-14B
slug: vllm/Qwen/Qwen3-14B
release_date: "2025-04-28"

generate_args:
  extra_body:
    reasoning:
      enabled: true

runpod:
  use: true
  model: Qwen/Qwen3-14B
  name: small-judge-qwen3-14b
  cloud_type: SECURE
  # 30GB of weights; KV is 160KB/token so ~13GB of cache holds 2 full 40k sequences.
  # Concurrency-bound, not memory-bound: an A100 ($1.39/h) triples cache but not price/token.
  gpu_id: NVIDIA A40   # 48GB, $0.44/h
  gpu_count: 1
  container_disk_in_gb: 40
  ready_timeout: 900
  vllm_args:
    - --dtype
    - bfloat16
