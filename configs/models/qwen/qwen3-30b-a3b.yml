# Quantization: Unquantized BF16 (vLLM / Runpod)
name: Qwen/Qwen3-30B-A3B
slug: vllm/Qwen/Qwen3-30B-A3B
release_date: "2025-04-28"

generate_args:
  # Native context is 40960 and we no longer stretch it (see runpod.vllm_args). vLLM 400s
  # when prompt + max_tokens exceeds max-model-len, so this reserves room for the longest
  # prompt we actually see: HLE is median 205 tokens, p99 1882, max 12105. Answers wanting
  # more than 28k of output truncate — deliberate, we stop at the native limit.
  max_tokens: 28672
  # A queued request can sit token-less for a long time; the default read timeout fires
  # and the sample dies.
  timeout: 7200
  extra_body:
    reasoning:
      enabled: true

runpod:
  use: true
  model: Qwen/Qwen3-30B-A3B
  name: small-judge-qwen3-30b-a3b
  cloud_type: SECURE
  # 61GB of bf16 weights (MoE, 3B active): same footprint as Qwen3-32B, so the same 2×A40 layout. No single ≤48GB card fits, and one 80GB card leaves ~10GB of KV
  # (one 40k sequence, no concurrency). 2×A40 = 96GB at $0.88/h, ~20GB of KV (~3 full-length
  # slots). A40 bandwidth is ~1/3 of an A100, so decode is ~3× slower per token at ~1/3 the
  # price: same cost per token, 3× the wall clock (HLE full pass ~36h). Pin
  # "NVIDIA A100 80GB PCIe" for speed.
  gpu_id: NVIDIA A40
  gpu_count: 2
  # Runpod's multi-GPU PCIe hosts (A40, L40S) ship with GPU peer-to-peer broken: NCCL init or
  # the first all-reduce hangs with every GPU at 100%. Seen on 2×A40 and 4×A40/L40S.
  env: {NCCL_P2P_DISABLE: "1"}
  container_disk_in_gb: 80
  ready_timeout: 5400   # 66GB of weights plus TP init; 1800 killed pods that were still loading
  model_args: {}
  vllm_args:
    - --dtype
    - bfloat16
    - --tensor-parallel-size
    - "2"
    # vLLM's custom all-reduce talks over CUDA IPC and ignores NCCL_P2P_DISABLE; on hosts with
    # broken P2P it hangs right after graph capture. NCCL handles the all-reduce instead.
    - --disable-custom-all-reduce
    # Stock Qwen3-32B stops at 40960. We used to stretch it to 131072 with YaRN, but that
    # left KV cache for only ~2-3 full-length sequences on 2xA100, so requests queued
    # token-less until the read timeout killed them. Native context, truncate the rest.
    - --max-model-len
    - "40960"
    - --enable-auto-tool-choice
    - --tool-call-parser
    - hermes
