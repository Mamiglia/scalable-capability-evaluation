# Quantization: Unquantized BF16 (vLLM / Runpod)
name: Qwen/Qwen3-32B
slug: vllm/Qwen/Qwen3-32B
release_date: "2025-04-28"

generate_args:
  extra_body:
    reasoning:
      enabled: true

runpod:
  use: true
  model: Qwen/Qwen3-32B
  name: small-judge-qwen3-32b
  cloud_type: SECURE
  gpu_id: NVIDIA A100 80GB PCIe
  gpu_count: 1
  container_disk_in_gb: 80
  ready_timeout: 1800
  # Agentic runs (SWE-bench) outlast the 12h default.
  terminate_after: 24h
  model_args:
    stream: false
  # Native context 40960, served unscaled: agentic runs must cap --max-tokens (8192) so
  # prompts have room, and long trajectories end at the context limit.
  vllm_args:
    - --dtype
    - bfloat16
    - --enable-auto-tool-choice
    - --tool-call-parser
    - hermes
