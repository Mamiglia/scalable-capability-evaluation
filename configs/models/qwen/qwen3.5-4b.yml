name: Qwen/Qwen3.5-4B
slug: vllm/Qwen/Qwen3.5-4B
release_date: "2026-02-27"
generate_args:
  max_tokens: 65536   # pod context is 262144
  extra_body:
    chat_template_kwargs:
      enable_thinking: true   # Qwen3.5 default, made explicit
runpod:
  use: true
  model: Qwen/Qwen3.5-4B
  name: sce-qwen35-4b
  cloud_type: SECURE
  gpu_id: NVIDIA RTX A4500   # 20GB, $0.25/h: 8GB of bf16 weights, hybrid attention keeps KV tiny
  ready_timeout: 2700   # A40-fallback pod stalled past the 1800 default on first retry (2026-09-05)
  vllm_args: [--reasoning-parser, qwen3, --enable-auto-tool-choice, --tool-call-parser, hermes]
