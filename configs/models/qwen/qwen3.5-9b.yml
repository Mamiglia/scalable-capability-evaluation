# Quantization: Unquantized BF16 (DeepInfra)
name: qwen/qwen3.5-9b
slug: openrouter/qwen/qwen3.5-9b
release_date: '2026-02-10'
generate_args:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  extra_body:
    min_p: 0.0
    repetition_penalty: 1.0
runpod:
  use: false
  model: Qwen/Qwen3.5-9B
  model_args: {}
  image: vllm/vllm-openai:latest
  name: small-judge-qwen35-9b
  cloud_type: SECURE
  gpu_id: NVIDIA A40
  gpu_count: 1
  container_disk_in_gb: 40
  port: 8000
  ready_timeout: 1800
  terminate_after: 4h
  create_args: []
  vllm_args:
  - --reasoning-parser
  - qwen3
  - --max-model-len
  - 32768
  - --gpu-memory-utilization
  - 0.9
model_args:
  provider:
    order:
    - DeepInfra
    quantizations:
    - bf16
