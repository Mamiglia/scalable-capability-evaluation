# Quantization: FP8 (Z.AI) — first-party endpoint, same pin as glm-5.3. Open weights, 25
# endpoints on OpenRouter (several fp4); pinning z-ai/fp8 keeps it off the fp4 servers.
# deliberate: z-ai/fp8 caps output at 131072 while Cloudflare/Morph/CoreWeave go to ~1.18M.
# First-party, and the same pin as glm-5.3.yml, so the two GLM models are served off the same
# stack and stay comparable. 131k is far above anything this roster's benches emit.
name: z-ai/glm-5.3-flash
release_date: '2026-08-26'
generate_args:
  extra_body:
    reasoning:
      enabled: true
  max_tokens: 131072
model_args:
  provider:
    only:
    - z-ai/fp8
    allow_fallbacks: false
