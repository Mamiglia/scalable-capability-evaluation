# Judge the style_capability conditions. Runner:
# scripts/analyses/style_capability/judge_run.py (two judge prompts: default +
# style-blind). Paths are relative to the main checkout cwd.

evals_dir: data/capability_spoofing/evals   # <shortname>/<log>.eval
log_root: logs/style_capability                   # <variant>/<judge>/<major>-vs-<minor>/
digest_out: judge_results/style_capability/verdicts  # <variant>/

judges:                       # none are authors; span weak/mid/strong
  - openrouter/openai/gpt-4.1-nano
  - openrouter/google/gemini-3.1-flash-lite
  - openrouter/google/gemma-4-31b-it

judge_model_args:             # pilot's live judge routing (fp8 for the open judge)
  openrouter/openai/gpt-4.1-nano:
    provider: {data_collection: deny, require_parameters: true}
  openrouter/google/gemini-3.1-flash-lite:
    provider: {data_collection: deny, require_parameters: true}
  openrouter/google/gemma-4-31b-it:
    provider: {only: [siliconflow/fp8], allow_fallbacks: false, require_parameters: true, data_collection: deny}

# [major, minor]: major = the strong-styled / spoofing side, so a counterbalanced
# picked_major > 0.5 means the judge preferred it. All judges judge all pairs,
# both slot orders, under both prompts.
comparisons:
  # within-answerer, fixed content: strong-copied style vs weak-copied style
  - [gpt-4o__copy_qwen3.5-122b-a10b, gpt-4o__copy_qwen3-32b]
  - [gemma-4-26b-a4b-it__copy_qwen3.5-122b-a10b, gemma-4-26b-a4b-it__copy_gpt-4o]
  - [qwen3-32b__copy_qwen3.5-122b-a10b, qwen3-32b__copy_gpt-4o]
  # strong answerer sandbagged: strong-peer style vs weak style (does it get marked down)
  - [qwen3.5-122b-a10b__copy_qwen3.6-35b-a3b, qwen3.5-122b-a10b__copy_gpt-4o]
  # cross-model headline: weak content + strong style  vs  strong content + weak style
  - [gpt-4o__copy_qwen3.5-122b-a10b, qwen3.5-122b-a10b__copy_gpt-4o]
