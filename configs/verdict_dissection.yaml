# Verdict dissection: which transcript features predict judge verdicts.
data:
  hf_judging_repo: LASR-G5/judging
  local_root: data/hf-judging
  judges: [Llama-3.1-8B-Instruct, gemma-4-31b-it, ling-2.6-flash,
           gpt-oss-120b, deepseek-r1-0528, o4-mini, deepseek-v4-flash-0731]
  benches: [gpqa, aime, intercode, swe_bench_mini]
  eci_table: external_data/epoch-eci/eci_scores.csv
  eci_extra: {ling-2.6-flash: 131.8, qwen3-32b: 130.0}
  out_dir: judge_results/verdict_dissection

entropy:
  model: meta-llama/Llama-3.2-3B    # base, not instruct
  window_tokens: 32                 # local-context pass
  max_tokens: 8192
  spike_sd_threshold: 2.0

fit:
  seed: 0
  warmup: 1000
  samples: 1000
  chains: 4
  target_accept: 0.9
  cv_folds: 5
