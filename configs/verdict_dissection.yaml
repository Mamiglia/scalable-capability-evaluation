# Verdict dissection: which transcript features predict judge verdicts.
data:
  hf_judging_repo: LASR-G5/judging
  local_root: data/hf-judging
  judges: [Llama-3.1-8B-Instruct, gemma-4-31b-it, ling-2.6-flash,
           gpt-oss-120b, deepseek-r1-0528, o4-mini, deepseek-v4-flash-0731]
  benches: [gpqa, aime, intercode, swe_bench_mini]
  eci_table: external_data/epoch-eci/eci_scores.csv
  eci_extra: {ling-2.6-flash: 131.8, qwen3-32b: 130.0}
  out_dir: judge_results/verdict_dissection

# matches per 1000 assistant chars, case-insensitive regex
style_lexicons:
  personal_pronouns: ["\\bI\\b", "\\bwe\\b", "\\bmy\\b", "\\bour\\b", "\\bme\\b", "\\bus\\b"]
  hedging: ["\\bmight\\b", "\\bperhaps\\b", "\\bpossibly\\b", "\\bseems?\\b", "\\blikely\\b", "\\bprobably\\b"]
  backtracking: ["\\bwait\\b", "\\bactually\\b", "\\bhmm\\b", "\\bon second thought\\b", "\\blet me reconsider\\b"]
  uncertainty: ["\\bnot sure\\b", "\\bunclear\\b", "\\buncertain\\b"]
  confidence: ["\\bclearly\\b", "\\bobviously\\b", "\\bcertainly\\b", "\\bdefinitely\\b"]
  questions: ["\\?"]

# a sentence takes the first class (in this order) whose cue it contains;
# specific cues before generic ones ("let me check" before "let ")
connective_classes:
  verification: ["let me check", "let me verify", "double-check", "to confirm", "substituting back"]
  premise: ["because", "since", "given that"]
  inference: ["therefore", "thus", "hence", "it follows", "which means", "this implies"]
  contrast: ["however", "but ", "although", "on the other hand"]
  assumption: ["suppose", "assume", "let ", "consider ", "if we"]

conclusion_tail_frac: 0.2          # last fifth of assistant chars = concluding section
answer_markers: ["final answer", "the answer is", "answer:", "\\\\boxed"]

entropy:
  model: meta-llama/Llama-3.2-3B    # base, not instruct
  window_tokens: 32                 # local-context pass
  max_tokens: 8192
  spike_sd_threshold: 2.0

fit:
  seed: 0
  warmup: 1000
  samples: 1000
  chains: 4
  target_accept: 0.9
  cv_folds: 5
