# Verdict dissection: which transcript features predict judge verdicts.
data:
  hf_judging_repo: LASR-G5/judging
  local_root: data/hf-judging
  judges: [Llama-3.1-8B-Instruct, gemma-4-31b-it, ling-2.6-flash,
           gpt-oss-120b, deepseek-r1-0528, o4-mini, deepseek-v4-flash-0731]
  models_list: configs/experiments/pairs/models.txt   # the canonical evaluated models
  rollouts: data                                       # data/<bench>/<collection>/<model>/<epoch>/*.eval
  collections:                                         # collection id per benchmark (LASR-G5/benchmarks)
    gpqa: b0a0d9c9
    aime2024: 44136fa3
    aime2025: 44136fa3
    aime2026: 44136fa3
    apex_2025: 44136fa3
    apex_shortlist: 44136fa3
    hle: f0ab1992
    intercode: 463eb861
    swe_bench_mini: 477dc96c
    mbpp: 4871cf01
  out_dir: judge_results/verdict_dissection

surprisal:
  models:                           # base models, one per family; short name -> HF id
    llama: meta-llama/Llama-3.2-3B
    qwen: Qwen/Qwen3-4B-Base
    gemma: google/gemma-3-4b-pt
  window_tokens: 32                 # local-context pass
  max_tokens: 8192

fit:
  seed: 0
  warmup: 1000
  samples: 1000
  chains: 4
  target_accept: 0.9
  cv_folds: 5
