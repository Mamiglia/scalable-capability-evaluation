scope:
  benchmarks: [gpqa, aime2024, aime2025, aime2026, intercode, swe_bench_mini]
  models:
    - claude-opus-4.7
    - claude-sonnet-4.5
    - deepseek-r1-0528
    - deepseek-v3.2
    - gemini-3.5-flash
    - gemma-3-12b-it
    - gemma-4-e2b-it
    - glm-4.6
    - glm-5.2
    - glm-5.3
    - gpt-4.1
    - gpt-5
    - granite-4.1-8b
    - kimi-k2.6
    - kimi-k3
    - ling-2.6-flash
    - mistral-medium-3
    - muse-glimmer-30b
    - nvidia-nemotron-3-ultra-550b-a55b-bf16
    - nvidia-nemotron-3.5-lightning-30b-a3b-bf16
    - o3
    - qwen3-32b
    - qwen3.5-4b
    - qwen3.5-9b
    - qwen3.8-2.4t-a95b
    - qwen3.8-27b
  split:
    seed: 0
    representation_train: 0.64
    representation_validation: 0.16
    confirmation: 0.20

models:
  qwen:
    model_id: Qwen/Qwen3-Embedding-4B
    revision: 5cf2132abc99cad020ac570b19d031efec650f2b
    context: 32768
    chunk_length: 30720
    overlap: 1024
    question_envelope: 2048
    pool: last
    hidden_layers: [24, 30]
    padding_side: left
    dimension: 2560
    license: Apache-2.0
    overlap_sensitivity: [512, 2048]
  bge:
    model_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    context: 8192
    chunk_length: 6144
    overlap: 512
    question_envelope: 2048
    pool: cls
    hidden_layers: [16, 20]
    padding_side: right
    dimension: 1024
    license: MIT
    overlap_sensitivity: [256, 1024]

extraction:
  batch_size: 8
  max_batch_tokens: 32768
  dtype: bfloat16
  attention_backend: sdpa
  determinism_sample: 256
  seed: 0
  max_abs_difference: 0.000001
  min_repeat_cosine: 0.999999
  overlap_median_cosine: 0.98
  overlap_fifth_percentile_cosine: 0.95
  min_overlap_rows: 32

sae:
  # one SAE per group; a group is a list of benchmarks that share a dictionary
  fit_groups:
    gpqa: [gpqa]
    aime: [aime2024, aime2025, aime2026]   # ~700 training rows per year overfit; pooled generalises
    intercode: [intercode]
    swe_bench_mini: [swe_bench_mini]
  # one more SAE over all benchmarks (equal training rows per benchmark), features named shared:i
  shared_group:
    name: shared
  centre_by_item: true   # subtract the item mean embedding: raw embeddings are ~80% question identity
  # BatchTopK SAE, WIMHF recipe (Movva et al. 2025, configs/*.json in rmovva/wimhf)
  width: 32
  top_k: 4
  matryoshka_prefixes: [8, 32]
  dead_neuron_threshold_steps: 64
  batch_size: 256
  learning_rate: 0.0005
  max_epochs: 50
  min_epochs: 10
  patience: 3
  seed: 0
  # shared-dictionary size sweep (transcript_sae_sweep.py): each entry overrides width / top_k / prefixes
  sweep:
    - {width: 32, top_k: 4, matryoshka_prefixes: [8, 32]}
    - {width: 32, top_k: 8, matryoshka_prefixes: [8, 32]}
    - {width: 32, top_k: 16, matryoshka_prefixes: [8, 32]}
    - {width: 64, top_k: 4, matryoshka_prefixes: [8, 32, 64]}
    - {width: 64, top_k: 8, matryoshka_prefixes: [8, 32, 64]}
    - {width: 64, top_k: 16, matryoshka_prefixes: [8, 32, 64]}

descriptions:
  # WIMHF interpretation + fidelity (configs/*.json in rmovva/wimhf), adapted to single transcripts
  interpreter_model: openai/gpt-5
  annotator_model: openai/gpt-5-mini
  # OpenRouter endpoint tags to pin (from /api/v1/models/<slug>/endpoints); fallbacks are refused
  openrouter_endpoints:
    openai/gpt-5: openai/default
    openai/gpt-5-mini: openai
  interpreter_max_tokens: 20000
  annotator_max_tokens: 2000
  n_candidates: 5
  interpret_examples: 10
  contrast_examples: 10
  top_percentile: 95
  scoring_examples: 300
  annotation_batch_size: 20   # transcripts per fidelity call; all of a feature's candidates are judged together
  max_words: 256
  min_correlation: 0.0
  p_value_threshold: null   # null = 0.05 / width (Bonferroni over the dictionary)
  min_prevalence: 0.05
  seed: 0
