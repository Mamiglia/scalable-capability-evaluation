# Clause-network features: clause/equation/tool nodes, automatic edges, typed topology, node/edge SAEs.
freeze: judge_results/verdict_dissection/freezes/v1-f722885fd822-a979476c1a66
verdicts: judge_results/verdict_dissection/freezes/v1-f722885fd822-a979476c1a66/verdicts.parquet
out_dir: judge_results/verdict_dissection/clause_network

segmenter:                                  # RST parser, runs in its own venv (scripts/discourse_network/segment.py)
  python: ~/.venvs/isanlp-rst/bin/python
  model: tchewik/isanlp_rst_v3
  version: gumrrg
  shards: 6                                 # parallel segmenter processes on the laptop

encoder:                                    # node embeddings
  model: Alibaba-NLP/gte-modernbert-base
  revision: e7f32e3c00f91d699e8c43b53106206bcc72bb22
  max_tokens: 2048                          # chunk length; longer nodes are chunked and mean-pooled
  batch_size: 32
  block_size: 2000                          # frequent resumable checkpoints for long-tail chunks
  device: mps

# Tool calls: `inspect` (read-only) vs `act` (changes state). First matching group wins; unmatched = act.
tool_types:
  inspect: [ls, cat, head, tail, grep, rg, find, wc, "sed -n", less, more, stat, file, which, pwd, echo,
            tree, diff, "git status", "git log", "git diff", "git show", view, read_file, list_dir, search]
  act: [submit, "sed -i", rm, mv, cp, touch, mkdir, tee, ">", ">>", pip, "git apply", "git commit",
        "git checkout", patch, chmod, create, str_replace, insert, write_file, edit_file, apply_patch]
python_write_markers: ["'w'", '"w"', "'a'", '"a"', os.remove, os.rename, shutil., subprocess, os.system,
                       .write_text, .unlink]
error_markers: [Traceback, "command not found", "No such file", "Error:", "error:", SyntaxError,
                "Permission denied", FAILED, "returned non-zero"]

edges:
  max_parents: 3
  k_similar: 2                              # long-range parents by embedding cosine, per target
  similarity_threshold: 0.70

sae:                                        # Top-K SAEs on node embeddings and edge vectors, fitted per group
  width: 32
  top_k: 4
  iterations: 20
  batch_size: 256
  seed: 0
  min_support: 50                           # a feature must be active on at least this many units
  edge_pca_components: 64
  benchmark_groups:                         # AIME years pooled for fitting only
    gpqa: [gpqa]
    aime: [aime2024, aime2025, aime2026]
    intercode: [intercode]
    swe_bench_mini: [swe_bench_mini]
