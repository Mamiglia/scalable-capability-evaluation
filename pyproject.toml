[project]
name = "small-judge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ijson>=3.5.1",
    "inspect-ai>=0.3.249",
    "inspect-evals>=0.16.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "openai>=2.49.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/core_bench.py"]


