[project]
name = "sce"
version = "0.1.0"
description = "Capability estimation from saturated-benchmark transcripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # inspect_evals[math] extra: without it the sympy scorer silently marks everything wrong
    "antlr4-python3-runtime~=4.11.0",
    "draccus>=0.11.6",
    "inspect-ai>=0.3.249",
    "inspect-evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@b943de6895ea2e8fa77383228d589b4f9bcd93ca",
    # Terminal-Bench via Harbor. Pulls litellm, which caps openai<3 — see [tool.uv] below.
    "inspect-harbor>=0.7.4",
    "matharena",  # vendored: third_party/matharena
    "matplotlib>=3.11",
    "numpyro>=0.15",
    "openai>=3.1.0",   # inspect-ai's OpenRouter provider requires it
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",       # analysis only, not needed for collection/judging
    "scipy>=1.18.0",
    "torch>=2.13.0",             # transcript embeddings only
    "transformers>=5.17",        # transcript embeddings only
    "zipfile-zstd>=0.0.4",
    "hibayes",
    "statsmodels>=0.15.0",
]

[project.scripts]
collect = "collect.cli:main"
reference = "reference.freeze:main"
evaluate = "capability.evaluate:main"

# litellm (via inspect-harbor) caps openai<3; inspect-ai's OpenRouter provider needs >=3.1.
# We never call litellm, so ignore its cap.
[tool.uv]
override-dependencies = ["openai>=3.1.0", "rich>=14.1.0"]  # hibayes caps rich<14; it only uses rich for console output

[tool.uv.sources]
hibayes = { git = "https://github.com/UKGovernmentBEIS/hibayes", rev = "4683a10dc08ddaa4237365feedff392259575d3b" }
matharena = { path = "third_party/matharena" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
