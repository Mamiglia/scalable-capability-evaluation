[project]
name = "small-judge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # inspect_evals[math] extra: without it the sympy scorer silently marks everything wrong
    "antlr4-python3-runtime~=4.11.0",
    "draccus>=0.11.6",
    "ijson>=3.5.1",
    "inspect-ai>=0.3.249",
    "inspect-evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@main",
    # Terminal-Bench via Harbor. Pulls litellm, which caps openai<3 — see [tool.uv] below.
    "inspect-harbor>=0.7.4",
    "matharena @ git+https://github.com/Mamiglia/inspect-matharena.git",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "numpyro>=0.15",
    "openai>=3.1.0",   # inspect-ai's OpenRouter provider requires it
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",       # analysis only, not needed for collection/judging
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.1",  # analysis only
    "torch>=2.13.0",             # analysis only
    "voyageai>=0.5.0",           # analysis only
    "zipfile-zstd>=0.0.4",
]

[project.scripts]
collect = "collect.cli:main"
judge = "judge.cli:main"
irt = "irt.cli:main"
rank = "ranking.cli:main"
domain = "domain.cli:main"

# litellm (via inspect-harbor) caps openai<3; inspect-ai's OpenRouter provider needs >=3.1.
# We never call litellm, so ignore its cap.
[tool.uv]
override-dependencies = ["openai>=3.1.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/core_bench.py"]
