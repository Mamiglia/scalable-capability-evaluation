# Score-prediction pipeline (docs/superpowers/plans/2026-08-04-transcript-score-model.md).
# Every script under scripts/analysis/score_prediction/ reads this; no hidden defaults.

verdicts_csv: judge_results/gpqa-pilot-rd2/verdicts.csv
models_csv: judge_results/gpqa-pilot-rd2/models.csv
summary_csv: judge_results/gpqa-pilot-rd2/summary.csv
out_dir: judge_results/score_prediction/8b   # one self-contained dir per encoder (0.6b/, 8b/)

encoder:
  provider: local               # local (sentence-transformers) | voyage (API)
  name: Qwen/Qwen3-Embedding-8B
  # name: voyage-3-large        # when provider: voyage
  output_dim: 4096
  batch_size: 1                 # texts per forward pass / API request
  device: null                  # null = auto (mps); cpu is slow but exact on long texts
  dtype: bfloat16               # local only; unset = fp32 (~30 GiB for the 8B)
  price_per_m_tokens: 0.18      # voyage only, dry-run cost estimate

mlp:
  judge_embed_dim: 4
  judge_embed_init_std: 0.1   # default N(0,1) dwarfs the unit-norm embedding dims
  betas: [0.9, 0.95]          # AdamW beta2 0.95, the tabular-MLP standard (RealMLP, fastai)
  batch_size: 256
  patience: 10
  max_epochs: 200
  hidden_dims_grid: [[256, 256], [256, 64], [64], [16]]
  dropout_grid: [0.15, 0.3]   # 0.15 = RealMLP meta-tuned default
  lr_grid: [0.001, 0.0003]
  weight_decay_grid: [0.02, 0.1]  # 0.02 = RealMLP default; 0.1 won the first sweep

folds:
  items: 5
  pairs: 5   # judges regime is leave-one-judge-out, no count needed

inner_folds: 5                # grouped inner split of each training fold; fold 0 = validation

ml_suite:
  logreg:
    l2_c_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    max_iter: 2000
  gbm:
    learning_rate_grid: [0.03, 0.05, 0.1]
    max_leaf_nodes_grid: [15, 31, 63]
    max_iter: 500             # ceiling; early stopping picks the actual count

evaluate:
  n_boot: 1000                # item-resampling bootstrap for pooled NLL CIs
  ece_bins: 10

seeds: [0, 1]
