data_loader:
  paths:
    extracted_data:
      - analysis/hibayes/gpqa_glm.csv

data_process:
  processors:
    - extract_observed_feature: {feature_name: chosen_left}
    - extract_features:
        categorical_features: [judge, item, transcript_condition]
        continuous_features:
          - length_difference_sd
          - capability_difference_sd
          - same_model_family
          - self_comparison
        category_order:
          transcript_condition: [raw, truncated_10, truncated_50, truncated_90]

model:
  path: scripts/hibayes/model.py
  models:
    - name: judge_feature_logistic_model
      config:
        predictors:
          - length_difference_sd
          - capability_difference_sd
          - same_model_family
          - self_comparison
        fit:
          # 2000, not 1000: at 1000 this model's worst effective sample size was
          # 1087 and r_hat rounded to 1.010, so the r_hat checker failed. 2000
          # samples x 4 chains gives 8000 draws, matching the feature sweep.
          samples: 2000
          warmup: 1000
          chains: 4
          seed: 0
          target_accept: 0.95

check:
  checkers:
    - prior_predictive_check: {num_samples: 200}
    - prior_predictive_plot: {interactive: false, kind: cumulative}
    - divergences
    - r_hat
    - ess_bulk
    - ess_tail
    - bfmi
    - loo
    - posterior_predictive_plot: {interactive: false, kind: cumulative, num_samples: 200}

communicate:
  path: scripts/hibayes/communicators.py
  communicators:
    - judge_feature_report:
        plot_exclude:
          - self_comparison
          - transcript_condition=truncated_10 vs raw
          - transcript_condition=truncated_50 vs raw
          - transcript_condition=truncated_90 vs raw
        predictors:
          - length_difference_sd
          - capability_difference_sd
          - same_model_family
          - self_comparison
    - trace_plot: {vars: [judge_intercepts, judge_predictor_effects, item_sigma], best_model: false}

platform:
  device_type: cpu
  chain_method: parallel
