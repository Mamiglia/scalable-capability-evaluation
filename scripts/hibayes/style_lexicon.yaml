# Hand-curated style lexicon for feature_rates (style_features.py).
# One key per category, terms matched as whole words/phrases, case-insensitive
# except the standalone pronoun "I".
#
# Changed from the starter lexicon after spot-validation on real transcripts
# (judge_results/rewrites/originals.jsonl): "clearly" dropped from confidence
# - see that category below for why.
personal_pronouns: [I, me, my, we, our, us]
hedging: [perhaps, possibly, might, may, seems, appears, likely, presumably, arguably, I think, I believe, could be]
backtracking: [wait, actually, on second thought, let me reconsider, oh wait, scratch that, correction, I made a mistake]
uncertainty: [unsure, not sure, uncertain, unclear, ambiguous, guess, hard to say]
# "clearly" removed: 66 hits in the transcript text feature_rates actually
# sees (a whole-file grep also matches "clearly" inside this item's own
# *question* wording and returns more - the extractor never sees the
# question). 54 of those 66 (82%) come from one GPQA item whose own question
# text reads "we want to clearly distinguish these two energy levels" -
# nearly every model answering it echoes "clearly resolve/distinguish" as
# the resolution-criterion term of art, not as a confidence marker. That one
# item is 54/75 = 72% of the whole category's pre-trim hit volume.
# Read the other 12 transcript hits by hand too, since a false positive
# confined to one item is a weaker case than one that generalises: none were
# a clean, manner-free confidence marker. About half ("clearly defined",
# "clearly given", sentence-initial "Clearly,") are the same resolution/
# proof-idiom pattern; the rest ("clearly support", "it's clearly green")
# are genuinely ambiguous between manner and confidence, not clean positives
# - so the risk isn't confined to the one item.
confidence: [obviously, certainly, definitely, undoubtedly, of course]
questions: ["?"]
