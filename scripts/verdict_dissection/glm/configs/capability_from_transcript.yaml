      - sae_shared_26
      - sae_shared_27
      - sae_shared_28
      - sae_shared_29
      - sae_shared_30
      - sae_shared_31
      test: test
model:
  path: scripts/verdict_dissection/glm/model.py
  models:
  - name: capability_from_transcript
    config:
      predictors:
      - log_chars
      - n_words
      - personal_pronouns_count
      - hedging_count
      - backtracking_count
      - uncertainty_count
      - confidence_count
      - questions_count
      - verification_count
      - connectives_count
      - contrast_count
      - numbered_steps_count
      - bullets_count
      - code_chars
      - latex_chars
      - surprisal_full_bpc__llama
      - surprisal_question_gain_bpc__llama
      - surprisal_total_context_gain_bpc__llama
      - surprisal_long_context_gain_bpc__llama
      - surprisal_rolling_short_position_adjusted_mean__llama
      - surprisal_rolling_long_position_adjusted_mean__llama
      - surprisal_rolling_long_question_position_adjusted_mean__llama
      - surprisal_rolling_context_gain_position_adjusted_mean__llama
      - surprisal_rolling_question_gain_position_adjusted_mean__llama
      - sae_shared_0
      - sae_shared_1
      - sae_shared_2
      - sae_shared_3
      - sae_shared_4
      - sae_shared_5
      - sae_shared_6
