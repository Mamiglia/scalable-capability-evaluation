data_loader:
  paths:
    extracted_data:
    - judge_results/verdict_dissection/glm_inputs/capability_from_transcript.parquet
data_process:
  processors:
  - extract_observed_feature:
      feature_name: logit_model_accuracy
      test: test
  - extract_features:
      categorical_features:
      - bench
      - item
      continuous_features:
      - log_chars
      - n_words
      - personal_pronouns_count
      - hedging_count
      - backtracking_count
      - uncertainty_count
      - confidence_count
      - questions_count
