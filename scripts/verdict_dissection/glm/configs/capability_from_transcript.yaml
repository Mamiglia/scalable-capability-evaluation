      - sae_shared_28
      - sae_shared_29
      - sae_shared_30
      - sae_shared_31
      fit:
        samples: 1000
        warmup: 1000
        chains: 4
        seed: 0
        target_accept: 0.9
check:
  checkers:
  - divergences
  - r_hat
  - ess_bulk
  - ess_tail
  - bfmi
  - loo
platform:
  device_type: cpu
  chain_method: parallel
