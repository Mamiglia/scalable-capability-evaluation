  model-fold-2: [kimi-k3, kimi-k2.6, nvidia-nemotron-3-ultra-550b-a55b-bf16, glm-4.6, claude-sonnet-4.5, qwen3-32b]
  model-fold-3: [claude-opus-4.7, gpt-5, o3, nvidia-nemotron-3.5-lightning-30b-a3b-bf16, qwen3.5-9b, gemma-4-e2b-it]
  top-6-models: [qwen3.8-2.4t-a95b, glm-5.3, kimi-k3, claude-opus-4.7, gemini-3.5-flash, qwen3.8-27b]
  middle-6-models: [nvidia-nemotron-3-ultra-550b-a55b-bf16, o3, muse-glimmer-30b, deepseek-r1-0528, glm-4.6, nvidia-nemotron-3.5-lightning-30b-a3b-bf16]
