# Held-out designs, one fit each. Model designs hold out whole models (all items seen); item folds
# hold out every 4th item in sorted order within each benchmark (all models seen). Rankings are by
# mean accuracy across the six benchmarks; model folds take every 4th model down that ranking, the
# bands take the top, middle (ranks 11-16) and bottom six.
item_folds: 4
model_designs:
  model-fold-0: [qwen3.8-2.4t-a95b, gemini-3.5-flash, deepseek-v3.2, muse-glimmer-30b, qwen3.5-4b, gpt-4.1, granite-4.1-8b]
