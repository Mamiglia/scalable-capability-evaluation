title: "MathArena: Uncontaminated Math Competition Problems"
description: |
  Final-answer problems from math competitions released after model training cutoffs
  (AIME, HMMT, BRUMO, CMIMC, SMT), plus MathArena Apex (the hardest recent final-answer
  problems) and ArxivMath (research-level problems extracted from arXiv papers). Each
  competition is one task. Reproduces MathArena's pipeline: the competition instruction
  prepended to the problem, a single "last chance" reprompt when no \boxed{} answer
  parses, and symbolic (sympy-based) grading — no LLM judge.
arxiv: https://arxiv.org/abs/2505.23281
group: Mathematics
